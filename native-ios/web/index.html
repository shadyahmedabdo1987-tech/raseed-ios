<style>:root{
  --brand1:#4F46E5;--brand2:#06B6D4;--brand3:#4338CA;
  --grad:linear-gradient(135deg,#4338CA 0%,#4F46E5 45%,#06B6D4 100%);
  --bg:#F3F5FB;--surface:#FFFFFF;--surface2:#F7F8FC;--line:#E6E9F2;
  --text:#0F172A;--text2:#475569;--text3:#94A3B8;
  --green:#10B981;--green-bg:#E7F8F1;--red:#EF4444;--red-bg:#FDECEC;--amber:#F59E0B;--amber-bg:#FEF4E2;
  --indigo-bg:#EEF0FE;
  --shadow:0 10px 30px -12px rgba(30,41,90,.18);
  --shadow-lg:0 24px 50px -18px rgba(67,56,202,.45);
  --r:18px;--nav-h:74px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#0B1020;--surface:#141A2E;--surface2:#1A2138;--line:#232B45;
  --text:#EEF2FF;--text2:#A5B0CC;--text3:#6B7594;
  --green-bg:rgba(16,185,129,.14);--red-bg:rgba(239,68,68,.14);--amber-bg:rgba(245,158,11,.14);--indigo-bg:rgba(99,102,241,.16);
  --shadow:0 10px 30px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Plex,system-ui,sans-serif;font-size:15px;line-height:1.55;overscroll-behavior:none}
body{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg.i{width:22px;height:22px;flex:none;stroke-width:1.8}
.num{font-feature-settings:"tnum";letter-spacing:-.2px}
.muted{color:var(--text2)}.faint{color:var(--text3)}
.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:100;background:#0B1020;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity .6s ease,visibility .6s}
#splash.hide{opacity:0;visibility:hidden}
#splash .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
#splash .b1{width:320px;height:320px;background:#4F46E5;top:-80px;right:-90px;animation:float1 6s ease-in-out infinite}
#splash .b2{width:280px;height:280px;background:#06B6D4;bottom:-60px;left:-80px;animation:float2 7s ease-in-out infinite}
#splash .logo{width:128px;height:128px;border-radius:32px;transform:scale(.3) rotate(-25deg);opacity:0;animation:logoIn 1s cubic-bezier(.2,1.4,.4,1) .15s forwards;box-shadow:0 30px 60px -20px rgba(79,70,229,.8)}
#splash .ring{position:absolute;width:190px;height:190px;border-radius:50%;border:2px solid rgba(255,255,255,.18);transform:scale(.4);opacity:0;animation:ring 1.6s ease-out .5s forwards}
#splash h1{margin:26px 0 4px;font-size:40px;font-weight:700;color:#fff;letter-spacing:.5px;opacity:0;transform:translateY(18px);animation:up .7s ease .75s forwards}
#splash p{margin:0;color:#A5B4FC;font-size:15px;opacity:0;transform:translateY(14px);animation:up .7s ease .95s forwards}
#splash .bar{position:absolute;bottom:calc(60px + var(--safe-b));width:120px;height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
#splash .bar i{display:block;height:100%;width:40%;border-radius:4px;background:linear-gradient(90deg,#4F46E5,#06B6D4);animation:load 1.1s ease-in-out infinite}
#splash .credit{position:absolute;bottom:calc(24px + var(--safe-b));color:rgba(255,255,255,.35);font-size:11px;letter-spacing:.5px}
@keyframes logoIn{to{transform:scale(1) rotate(0);opacity:1}}
@keyframes ring{60%{opacity:1}to{transform:scale(1.6);opacity:0}}
@keyframes up{to{opacity:1;transform:none}}
@keyframes load{0%{transform:translateX(160%)}100%{transform:translateX(-260%)}}
@keyframes float1{50%{transform:translate(-30px,40px) scale(1.1)}}
@keyframes float2{50%{transform:translate(30px,-30px) scale(1.15)}}

/* ---------- Lock ---------- */
#lock{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px}
#lock.show{display:flex}
#lock img{width:72px;height:72px;border-radius:20px}
.pin-dots{display:flex;gap:14px;direction:ltr}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--brand1);transition:.2s}
.pin-dots i.on{background:var(--brand1);transform:scale(1.15)}
.pin-dots.err{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;direction:ltr}
.keypad button{height:72px;border-radius:50%;background:var(--surface);font-size:26px;font-weight:500;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.keypad button:active{transform:scale(.92);background:var(--indigo-bg)}

/* ---------- App shell ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 30px);scroll-behavior:smooth}
.page{animation:pageIn .45s cubic-bezier(.2,.8,.2,1)}
.page.back{animation:pageInBack .45s cubic-bezier(.2,.8,.2,1)}
@keyframes pageIn{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes pageInBack{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + var(--safe-t)) 18px 10px;gap:10px}
.topbar h2{margin:0;font-size:22px;font-weight:700}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);color:var(--text);transition:transform .15s}
.icon-btn:active{transform:scale(.9)}

/* hero header */
.hero{position:relative;padding:calc(16px + var(--safe-t)) 0 0;overflow:hidden}
.hero-bg{position:absolute;inset:0 0 auto 0;height:300px;background:var(--grad);border-radius:0 0 34px 34px;overflow:hidden}
.hero-bg::before,.hero-bg::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09)}
.hero-bg::before{width:260px;height:260px;top:-90px;left:-70px;animation:float1 9s ease-in-out infinite}
.hero-bg::after{width:180px;height:180px;bottom:-60px;right:-40px;animation:float2 8s ease-in-out infinite}
.hero-top{position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#fff}
.hello small{display:block;opacity:.8;font-size:13px}
.hello b{font-size:20px;font-weight:700}
.hero-top .icon-btn{background:rgba(255,255,255,.16);color:#fff;box-shadow:none;backdrop-filter:blur(8px)}

/* slider */
.slider{position:relative;margin-top:18px;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 18px 22px;scrollbar-width:none}
.slider::-webkit-scrollbar{display:none}
.slide{flex:0 0 calc(100% - 36px);scroll-snap-align:center;border-radius:26px;padding:20px;color:#fff;position:relative;overflow:hidden;min-height:178px;box-shadow:var(--shadow-lg);transition:transform .4s}
.slide::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08);left:-60px;bottom:-90px}
.s1{background:linear-gradient(140deg,#1E1B4B,#312E81 60%,#4338CA)}
.s2{background:linear-gradient(140deg,#065F46,#047857 55%,#0EA5A4)}
.s3{background:linear-gradient(140deg,#7C2D12,#B45309 60%,#F59E0B)}
.s4{background:linear-gradient(140deg,#701A75,#9D174D 60%,#E11D48)}
.slide .lbl{display:flex;align-items:center;gap:8px;opacity:.85;font-size:14px}
.slide .big{font-size:34px;font-weight:700;margin:8px 0 2px;line-height:1.2}
.slide .big small{font-size:15px;font-weight:500;opacity:.8;margin-inline-start:4px}
.slide .row{display:flex;gap:10px;margin-top:14px;position:relative;z-index:1}
.slide .pill{flex:1;background:rgba(255,255,255,.13);border-radius:14px;padding:8px 10px;font-size:12px}
.slide .pill b{display:block;font-size:15px;font-weight:600}
.slide .chip{position:absolute;top:18px;left:18px;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:20px;font-size:12px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:-10px}
.dots i{width:7px;height:7px;border-radius:7px;background:var(--line);transition:all .35s}
.dots i.on{width:22px;background:var(--brand1)}
.mini-prog{height:8px;border-radius:8px;background:rgba(255,255,255,.18);margin-top:12px;overflow:hidden}
.mini-prog i{display:block;height:100%;border-radius:8px;background:#fff;width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:18px 18px 4px}
.qa{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--text2)}
.qa span{width:58px;height:58px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:var(--surface);box-shadow:var(--shadow);transition:transform .2s}
.qa:active span{transform:scale(.88)}
.qa svg{width:26px;height:26px}

/* sections & cards */
.sec{padding:16px 18px 0}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-h h3{margin:0;font-size:17px;font-weight:700}
.sec-h button{color:var(--brand1);font-size:13px;font-weight:600}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card+.card{margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.stat .t{font-size:12.5px;color:var(--text2);display:flex;align-items:center;gap:6px}
.stat .v{font-size:20px;font-weight:700;margin-top:4px}
.stat .d{font-size:12px;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.b-green{background:var(--green-bg);color:var(--green)}.b-red{background:var(--red-bg);color:var(--red)}.b-amber{background:var(--amber-bg);color:var(--amber)}.b-indigo{background:var(--indigo-bg);color:var(--brand1)}

/* list items */
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);opacity:0;animation:itemIn .5s cubic-bezier(.2,.8,.2,1) forwards;width:100%;text-align:start;position:relative}
.item:last-child{border-bottom:0}
.item:active{background:var(--surface2)}
@keyframes itemIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:22px;height:22px}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mid small{color:var(--text3);font-size:12px}
.item .amt{font-weight:700;font-size:15px;white-space:nowrap}
.day-h{padding:12px 4px 6px;font-size:13px;color:var(--text3);font-weight:600;display:flex;justify-content:space-between}
.empty{text-align:center;padding:34px 20px;color:var(--text3)}
.empty svg{width:56px;height:56px;stroke-width:1.2;color:var(--brand1);opacity:.5;margin-bottom:8px}

/* bars */
.bar-row{margin:12px 0}
.bar-row .top{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;margin-bottom:6px;gap:8px}
.bar-row .top span{display:flex;align-items:center;gap:8px;font-weight:600}
.track{height:9px;background:var(--surface2);border-radius:9px;overflow:hidden}
.track i{display:block;height:100%;border-radius:9px;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}

/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--surface);display:flex;align-items:center;justify-content:space-around;box-shadow:0 -10px 30px -14px rgba(30,41,90,.22);border-radius:26px 26px 0 0;z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--text3);flex:1;transition:color .25s;position:relative;padding-top:6px}
.nav button.on{color:var(--brand1)}
.nav button.on::before{content:"";position:absolute;top:-4px;width:26px;height:4px;border-radius:4px;background:var(--grad);animation:pop .35s}
@keyframes pop{from{transform:scaleX(0)}}
.nav .fab-wrap{flex:none;width:76px;display:flex;justify-content:center}
.fab{width:62px;height:62px;border-radius:22px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-40px;box-shadow:var(--shadow-lg);transition:transform .3s cubic-bezier(.2,1.4,.4,1)}
.fab svg{width:30px;height:30px;stroke-width:2.4;transition:transform .35s}
.fab.open svg{transform:rotate(135deg)}
.fab:active{transform:scale(.9)}

/* FAB menu */
.fab-menu{position:fixed;inset:0;z-index:19;background:rgba(10,14,30,.45);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:.3s}
.fab-menu.show{opacity:1;visibility:visible}
.fab-menu .opts{position:absolute;bottom:calc(var(--nav-h) + var(--safe-b) + 34px);left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(2,150px);gap:12px}
.fab-menu .opt{background:var(--surface);border-radius:20px;padding:14px;display:flex;align-items:center;gap:10px;font-weight:600;box-shadow:var(--shadow);transform:translateY(30px) scale(.8);opacity:0;transition:.35s cubic-bezier(.2,1.3,.4,1)}
.fab-menu.show .opt{transform:none;opacity:1}
.fab-menu.show .opt:nth-child(2){transition-delay:.04s}.fab-menu.show .opt:nth-child(3){transition-delay:.08s}.fab-menu.show .opt:nth-child(4){transition-delay:.12s}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,30,.5);z-index:40;opacity:0;transition:opacity .3s}
.sheet-bg.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:28px 28px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .42s cubic-bezier(.2,.9,.2,1);padding:10px 18px calc(22px + var(--safe-b))}
.sheet.show{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:space-between}

/* forms */
.seg{display:flex;background:var(--surface);border-radius:14px;padding:4px;box-shadow:var(--shadow);margin-bottom:14px;position:relative}
.seg button{flex:1;padding:10px 6px;border-radius:11px;font-weight:600;font-size:14px;color:var(--text2);transition:.25s;position:relative;z-index:1}
.seg button.on{color:#fff;background:var(--grad);box-shadow:0 6px 16px -6px rgba(79,70,229,.6)}
.seg.exp button.on{background:linear-gradient(135deg,#E11D48,#F97316)}
.seg.inc button.on{background:linear-gradient(135deg,#059669,#10B981)}
.amount-box{background:var(--surface);border-radius:20px;padding:16px;text-align:center;box-shadow:var(--shadow);margin-bottom:14px}
.amount-box input{border:0;outline:0;background:none;text-align:center;font-size:38px;font-weight:700;width:100%;direction:ltr}
.amount-box small{color:var(--text3)}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;font-weight:500}
.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;outline:0;transition:border .2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand1)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.cat{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:16px;background:var(--surface);border:2px solid transparent;font-size:11.5px;font-weight:500;transition:.2s;text-align:center;line-height:1.25}
.cat .ic{width:38px;height:38px;border-radius:12px}
.cat.on{border-color:var(--brand1);transform:translateY(-2px);box-shadow:var(--shadow)}
.btn{width:100%;padding:14px;border-radius:16px;background:var(--grad);color:#fff;font-weight:700;font-size:16px;box-shadow:0 12px 24px -10px rgba(79,70,229,.6);display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.btn.danger{background:var(--red-bg);color:var(--red);box-shadow:none}
.btn.sm{padding:9px 14px;font-size:14px;width:auto;border-radius:12px}
.btns{display:flex;gap:10px;margin-top:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip-b{padding:8px 14px;border-radius:20px;background:var(--surface);font-size:13px;font-weight:600;white-space:nowrap;color:var(--text2);box-shadow:var(--shadow);transition:.2s}
.chip-b.on{background:var(--text);color:var(--bg)}
.search{margin:0 18px 10px;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:0 12px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;outline:0;background:none;padding:12px 0}
.switch{width:50px;height:30px;border-radius:30px;background:var(--line);position:relative;transition:.25s;flex:none}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.switch.on{background:var(--brand1)}
.switch.on::after{right:23px}

/* debts */
.debt{display:block;width:100%;text-align:start;background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px;opacity:0;animation:itemIn .5s cubic-bezier(.2,.8,.2,1) forwards}
.debt .top{display:flex;align-items:center;gap:12px}
.ring{width:62px;height:62px;flex:none;position:relative}
.ring svg{width:62px;height:62px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bgc{stroke:var(--surface2)}
.ring .fg{stroke-linecap:round;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.debt .meta{display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--text2)}
.debt .meta b{display:block;color:var(--text);font-size:14px}
.inst{opacity:0;animation:itemIn .5s cubic-bezier(.2,.8,.2,1) forwards;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:var(--surface);margin-bottom:8px;box-shadow:var(--shadow)}
.inst .n{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--indigo-bg);color:var(--brand1);flex:none}
.inst.paid .n{background:var(--green-bg);color:var(--green)}
.inst.late .n{background:var(--red-bg);color:var(--red)}
.inst .mid{flex:1}
.inst .mid b{display:block;font-size:14px}
.inst .mid small{font-size:12px;color:var(--text3)}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:Plex;font-size:10px;fill:var(--text3)}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut-wrap svg{width:140px;height:140px;flex:none}
.legend{flex:1;display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.legend div{display:flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.insight{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.insight:last-child{border-bottom:0}
.insight .ic{width:38px;height:38px;border-radius:12px}
.insight b{display:block;font-size:14px;margin-bottom:2px}
.insight p{margin:0;font-size:13px;color:var(--text2)}
.alert{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;font-size:13.5px;font-weight:500;margin-bottom:10px}

/* settings */
.set-group{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.set{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line);width:100%;text-align:start}
.set:last-child{border-bottom:0}
.set .ic{width:38px;height:38px;border-radius:12px}
.set .mid{flex:1}
.set .mid small{display:block;color:var(--text3);font-size:12px}

/* toast */
#toast{position:fixed;top:calc(20px + var(--safe-t));left:50%;transform:translate(-50%,calc(-100% - 40px - var(--safe-t)));opacity:0;visibility:hidden;z-index:200;background:var(--text);color:var(--bg);padding:11px 18px;border-radius:16px;font-weight:600;font-size:14px;transition:transform .45s cubic-bezier(.2,1.3,.4,1),opacity .25s,visibility .45s;display:flex;gap:8px;align-items:center;max-width:90vw;box-shadow:var(--shadow)}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .45s cubic-bezier(.2,1.3,.4,1),opacity .2s}

/* ripple */
.rip{position:relative;overflow:hidden}
.rip .rp{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);animation:rp .6s ease-out;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}

/* onboarding */
#onb{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column}
#onb.show{display:flex}
.onb-slides{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.onb-slides::-webkit-scrollbar{display:none}
.onb-s{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
.onb-art{width:220px;height:220px;border-radius:60px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:34px;box-shadow:var(--shadow-lg);animation:bob 3.5s ease-in-out infinite;position:relative}
.onb-art svg{width:100px;height:100px;stroke-width:1.4}
.onb-art::after{content:"";position:absolute;inset:-14px;border-radius:70px;border:2px dashed rgba(79,70,229,.3);animation:spin 18s linear infinite}
@keyframes bob{50%{transform:translateY(-12px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.onb-s h2{font-size:24px;margin:0 0 8px}
.onb-s p{color:var(--text2);margin:0;max-width:300px}
.onb-foot{padding:18px 24px calc(26px + var(--safe-b))}

/* print area hidden */
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block}}

/* ================= v1.3 — motion & polish ================= */
:root{--ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.45,.5,1)}
/* page transitions (RTL: forward enters from the left) */
.page{animation:pgFwd .55s var(--ease) both}
.page.back{animation:pgBwd .55s var(--ease) both}
.page.soft{animation:none}
@keyframes pgFwd{from{opacity:0;transform:translateX(-56px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pgBwd{from{opacity:0;transform:translateX(56px) scale(.985)}to{opacity:1;transform:none}}
.page.soft .rise{animation:none}
.rise{animation:rise .6s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.topbar h2{animation:titleIn .6s var(--ease) both}
@keyframes titleIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.page.soft .topbar h2{animation:none}

/* hero */
.hero-bg{will-change:transform;transition:transform .05s linear}
.hero-top .hello{animation:rise .7s var(--ease) .05s both}
.page.soft .hero-top .hello{animation:none}
.slider{will-change:opacity}
.slide{transition:transform .5s var(--ease),box-shadow .5s}
.slide::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.14) 45%,transparent 60%);transform:translateX(120%);animation:sheen 5.5s ease-in-out 1.2s infinite;pointer-events:none}
@keyframes sheen{0%,70%{transform:translateX(120%)}100%{transform:translateX(-120%)}}

/* bottom nav: sliding pill */
.nav{overflow:visible}
#navPill{position:absolute;top:8px;left:0;width:56px;height:34px;border-radius:14px;background:var(--indigo-bg);transition:transform .5s var(--spring),opacity .3s;pointer-events:none;z-index:0}
.nav button{z-index:1}
.nav button.on::before{display:none}
.nav button svg{transition:transform .35s var(--spring)}
.nav button.on svg{transform:translateY(-1px) scale(1.08)}
.nav button.bump svg{animation:bump .5s var(--spring)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.28) translateY(-3px)}100%{transform:translateY(-1px) scale(1.08)}}
.fab{position:relative}
.fab::after{content:"";position:absolute;inset:-6px;border-radius:26px;border:2px solid rgba(79,70,229,.35);animation:fabRing 2.8s ease-out infinite;pointer-events:none}
@keyframes fabRing{0%{transform:scale(.85);opacity:.9}80%,100%{transform:scale(1.25);opacity:0}}
.fab.open::after{animation:none;opacity:0}

/* buttons */
button{transition:transform .18s var(--ease),box-shadow .25s,background .25s,color .25s,opacity .2s}
.btn{position:relative;overflow:hidden;letter-spacing:.2px;border-radius:18px;min-height:52px;box-shadow:0 14px 28px -12px rgba(79,70,229,.65),inset 0 1px 0 rgba(255,255,255,.25)}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-18deg);animation:btnShine 4.2s ease-in-out infinite}
.btn.ghost::after,.btn.danger::after,.btn.sm::after{display:none}
@keyframes btnShine{0%,65%{left:-60%}100%{left:130%}}
.btn:active{transform:scale(.96);box-shadow:0 6px 14px -8px rgba(79,70,229,.6)}
.btn.ghost{border:1px solid var(--line);box-shadow:var(--shadow)}
.btn.sm{min-height:auto;box-shadow:0 8px 16px -8px rgba(79,70,229,.6)}
.icon-btn{border:1px solid var(--line)}
.icon-btn:active,.chip-b:active,.cat:active,.pdf-opt:active{transform:scale(.92)}
.hero-top .icon-btn{border-color:rgba(255,255,255,.2)}
.qa span{border:1px solid var(--line);position:relative;overflow:hidden}
.qa span::before{content:"";position:absolute;inset:0;background:currentColor;opacity:.08}
.qa:active span{transform:scale(.86) rotate(-4deg)}
.quick .qa{animation:rise .6s var(--ease) both}
.quick .qa:nth-child(2){animation-delay:.06s}.quick .qa:nth-child(3){animation-delay:.12s}.quick .qa:nth-child(4){animation-delay:.18s}
.page.soft .quick .qa{animation:none}
.chip-b{border:1px solid var(--line)}
.chip-b.on{border-color:transparent;box-shadow:0 8px 18px -10px rgba(15,23,42,.6)}
.seg button.on{animation:segOn .35s var(--spring)}
@keyframes segOn{from{transform:scale(.92)}to{transform:none}}
.item{transition:background .2s,transform .18s}
.item:active{transform:scale(.985)}
.card,.stat,.list,.debt{border:1px solid var(--line)}
.debt:active{transform:scale(.98)}
.cat{border:2px solid var(--line)}
.cat.on{border-color:var(--brand1);background:var(--indigo-bg)}
.cat .ic{transition:transform .35s var(--spring)}
.cat.on .ic{transform:scale(1.12) rotate(-6deg)}

/* sheet spring */
.sheet{transition:transform .5s var(--spring)}
.sheet>*:not(.grab){animation:rise .5s var(--ease) both}
.sheet>*:nth-child(3){animation-delay:.04s}.sheet>*:nth-child(4){animation-delay:.08s}.sheet>*:nth-child(5){animation-delay:.12s}.sheet>*:nth-child(6){animation-delay:.16s}.sheet>*:nth-child(n+7){animation-delay:.2s}

/* note suggestions */
.note-wrap{position:relative}
.note-wrap input{padding-left:44px}
.note-x{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text3);background:var(--surface2)}
.note-x svg{width:16px;height:16px}
.sugg{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:none;align-items:center;min-height:8px}
.sugg::-webkit-scrollbar{display:none}
.sugg-h{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--text3);white-space:nowrap;flex:none}
.sugg-h svg{width:14px;height:14px}
.sg{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);white-space:nowrap;animation:sgIn .35s var(--spring) both}
.sg b{font-weight:600;font-size:13.5px}
.sg small{font-size:11.5px;color:var(--brand1);background:var(--indigo-bg);padding:1px 7px;border-radius:8px}
.sg:active{transform:scale(.93);background:var(--indigo-bg)}
@keyframes sgIn{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}

/* pdf options & busy */
.pdf-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pdf-opt{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:start}
.pdf-opt .ic{width:46px;height:46px;border-radius:15px;margin-bottom:4px}
.pdf-opt b{font-size:15px}
.pdf-opt small{color:var(--text3);font-size:12px;line-height:1.4}
#busy{position:fixed;inset:0;z-index:300;background:rgba(10,14,30,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:.3s}
#busy.show{opacity:1;visibility:visible}
.busy-card{background:var(--surface);border-radius:24px;padding:26px 30px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:var(--shadow-lg);transform:scale(.9);transition:transform .4s var(--spring)}
#busy.show .busy-card{transform:none}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--indigo-bg);border-top-color:var(--brand1);animation:spin .8s linear infinite}
.done-anim{width:74px;height:74px;margin:6px auto 12px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;animation:popIn .6s var(--spring) both;box-shadow:0 14px 30px -10px rgba(16,185,129,.7)}
.done-anim svg{width:38px;height:38px;stroke-width:2.6}
@keyframes popIn{from{transform:scale(0) rotate(-40deg)}to{transform:none}}

/* toast */
#toast svg{background:rgba(255,255,255,.15);border-radius:8px;padding:3px;width:24px;height:24px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.restore-card{width:100%;display:flex;align-items:center;gap:12px;border:1.5px dashed var(--brand1)!important;background:var(--surface)}
.restore-card b{display:block;font-size:15px}.restore-card small{color:var(--text3);font-size:12.5px}
/* lock v1.4 */
#lock{background:radial-gradient(120% 70% at 50% 0%,var(--indigo-bg),var(--bg) 60%)}
#lock.show>*{animation:rise .55s var(--ease) both}
#lock.show>*:nth-child(2){animation-delay:.05s}#lock.show>*:nth-child(3){animation-delay:.1s}#lock.show>*:nth-child(4){animation-delay:.15s}#lock.show>*:nth-child(5){animation-delay:.2s}
#lock.out{animation:lockOut .38s var(--ease) forwards}
@keyframes lockOut{to{opacity:0;transform:scale(1.06)}}
.lock-logo{width:84px;height:84px;border-radius:26px;box-shadow:0 18px 40px -14px rgba(79,70,229,.7);overflow:hidden}
.lock-logo img{width:100%;height:100%}
.keypad button{border:1px solid var(--line)}
.bio-k{background:var(--grad)!important;color:#fff;border:0!important;box-shadow:0 12px 24px -10px rgba(79,70,229,.7)!important}
.bio-k svg{width:32px;height:32px;stroke-width:1.6}
.bio-k:active{transform:scale(.9)}

/* ================= v1.5 animated splash ================= */
#splash{background:radial-gradient(90% 60% at 50% 42%,#1a1f4a 0%,#0B1020 70%)}
#splash .blob{transition:opacity .5s}
.sp-stage{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center}
.sp-logo{width:150px;height:150px;overflow:visible;filter:drop-shadow(0 26px 40px rgba(79,70,229,.55))}
.sp-logo *{transform-box:fill-box}
/* 1) background pops */
.sp-bg{transform-origin:center;transform:scale(.2) rotate(-30deg);opacity:0;animation:spBg .8s cubic-bezier(.2,1.5,.4,1) .1s forwards}
@keyframes spBg{to{transform:none;opacity:1}}
/* 2) bars grow from the bottom */
.sp-bar{transform-origin:50% 100%;transform:scaleY(0);animation:spBar .7s cubic-bezier(.3,1.6,.5,1) forwards}
.sp-bar.k1{animation-delay:.55s}.sp-bar.k2{animation-delay:.68s}.sp-bar.k3{animation-delay:.81s}
@keyframes spBar{to{transform:scaleY(1)}}
/* 3) arrow draws upward, then the head */
.sp-arrow{stroke-dasharray:1;stroke-dashoffset:1;animation:spDraw .6s cubic-bezier(.6,0,.2,1) 1s forwards}
.sp-head{stroke-dasharray:1;stroke-dashoffset:1;animation:spDraw .3s ease-out 1.5s forwards}
@keyframes spDraw{to{stroke-dashoffset:0}}
/* 4) ring draws, then spins forever */
.sp-ringg{transform-origin:center;animation:spSpin 1.6s linear 1.55s infinite}
.sp-ring{opacity:0;stroke-dasharray:0 100;animation:spRing .55s ease-out 1.15s forwards}
@keyframes spRing{0%{opacity:1}to{opacity:1;stroke-dasharray:80 20}}
@keyframes spSpin{to{transform:rotate(360deg)}}
.sp-dot{transform-origin:center;transform:scale(0);animation:spDot .5s cubic-bezier(.3,1.8,.5,1) 1.45s forwards,spPulse 1.2s ease-in-out 2s infinite}
@keyframes spDot{to{transform:scale(1)}}
@keyframes spPulse{50%{transform:scale(.7)}}
/* 5) shine + waves */
.sp-shine{animation:spShine 1s ease-in-out 1.75s forwards}
@keyframes spShine{to{transform:rotate(20deg) translateX(900px)}}
.wave{position:absolute;inset:-6px;border-radius:44px;border:2px solid rgba(129,140,248,.55);opacity:0;animation:spWave 1.4s ease-out forwards}
.wave.w1{animation-delay:1.7s}.wave.w2{animation-delay:1.9s}.wave.w3{animation-delay:2.1s}
@keyframes spWave{0%{opacity:.9;transform:scale(.9)}100%{opacity:0;transform:scale(2.1);border-radius:50%}}
#splash .sp-title{margin:30px 0 4px;font-size:42px;font-weight:700;color:#fff;letter-spacing:.5px;opacity:0;transform:translateY(20px);animation:up .7s var(--ease) 1.25s forwards}
#splash .sp-sub{margin:0;color:#A5B4FC;font-size:15px;opacity:0;transform:translateY(14px);animation:up .7s var(--ease) 1.45s forwards}
#splash .bar{opacity:0;animation:up .5s ease .3s forwards}
#splash .bar i{animation:spLoad 2.3s cubic-bezier(.6,0,.3,1) .3s forwards;width:0;transform:none}
@keyframes spLoad{to{width:100%}}
/* 6) exit — zoom through the logo */
#splash.exit{animation:spOut .7s ease .25s forwards;pointer-events:none}
#splash.exit .sp-stage{animation:spZoom .75s cubic-bezier(.7,0,.84,0) forwards}
#splash.exit .sp-title,#splash.exit .sp-sub,#splash.exit .bar,#splash.exit .credit{animation:spFade .3s ease forwards}
#splash.exit .blob{opacity:0}
@keyframes spZoom{0%{transform:scale(1)}18%{transform:scale(.88)}100%{transform:scale(16);opacity:0}}
@keyframes spFade{to{opacity:0;transform:translateY(-12px)}}
@keyframes spOut{to{opacity:0}}
#splash.hide{display:none}
#app.pre{opacity:0}
#app.enter{animation:appIn .8s cubic-bezier(.16,1,.3,1) both}
@keyframes appIn{from{opacity:0;transform:scale(1.14)}to{opacity:1;transform:none}}
/* ================= v1.6 bank cards ================= */

/* ---------- English / LTR ---------- */
[dir=ltr] .i-chevron-left,[dir=ltr] .i-chevron-right,[dir=ltr] .i-arrow-left,[dir=ltr] .i-arrow-right{transform:scaleX(-1)}
[dir=ltr] .switch::after{right:auto;left:3px}
[dir=ltr] .switch.on::after{left:23px}
[dir=ltr] .page{animation-name:pgFwdL}
[dir=ltr] .page.back{animation-name:pgBwdL}
[dir=ltr] .page.soft{animation:none}
@keyframes pgFwdL{from{opacity:0;transform:translateX(56px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pgBwdL{from{opacity:0;transform:translateX(-56px) scale(.985)}to{opacity:1;transform:none}}
[dir=ltr] .topbar h2{animation-name:titleInL}
[dir=ltr] .page.soft .topbar h2{animation:none}
@keyframes titleInL{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
[dir=ltr] .note-wrap input{padding-left:14px;padding-right:44px}
[dir=ltr] .note-x{left:auto;right:8px}
[dir=ltr] .bc-num{text-align:left}
.onb-lang{position:absolute;top:calc(14px + var(--safe-t));inset-inline-end:16px;z-index:3;display:flex;gap:6px;align-items:center;background:var(--surface);color:var(--text);padding:8px 14px;border-radius:14px;font-weight:600;font-size:13px;box-shadow:var(--shadow)}.onb-lang svg{width:18px;height:18px}
[dir=ltr] .slide .chip{left:auto;right:18px}
[dir=ltr] .slide::after{left:auto;right:-60px}

/* ---------- paywall ---------- */
#pay{position:fixed;inset:0;z-index:95;background:radial-gradient(120% 60% at 80% 0%,#2a2f9a 0%,#0b1150 50%,#070B3E 100%);color:#fff;display:none;overflow-y:auto;padding:calc(30px + var(--safe-t)) 22px calc(24px + var(--safe-b))}
#pay.show{display:block;animation:rise .5s var(--ease) both}
.pay-in{max-width:420px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.pay-in img{width:84px;height:84px;border-radius:24px;box-shadow:0 18px 40px -12px rgba(34,211,238,.5)}
.pay-in h2{margin:6px 0 0;font-size:24px}.pay-in .muted{color:#C7D2FE;margin:0}
.pay-list{width:100%;background:rgba(255,255,255,.07);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;text-align:start;margin-top:6px}

.pay-link{color:#A5B4FC;font-weight:600;display:flex;gap:6px;align-items:center;padding:6px}.pay-link svg{width:18px;height:18px}

const AR = '٠١٢٣٤٥٦٧٨٩';
function toAr(str) { return String(str).replace(/[0-9]/g, d => AR[d]).replace(/,/g, '٬'); }
function N(n, plain = false) {
  if (n == null || isNaN(n)) n = 0;
  const s = plain ? String(n) : Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 });
  return (EN || Store.data.settings.digits === 'en') ? s : toAr(s);
}
const money = (n, sign = false) => {
  const v = Math.abs(r3(n));
  const pre = sign ? (n > 0 ? '+' : n < 0 ? '−' : '') : (n < 0 ? '−' : '');
  return `${pre}${N(v)} <small>${esc(Store.data.settings.currency)}</small>`;
};
const moneyT = n => `${n < 0 ? '−' : ''}${N(Math.abs(r3(n)))} ${Store.data.settings.currency}`;
function parseNum(s) {
  s = String(s || '').trim().replace(/[٠-٩]/g, d => AR.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٬,\s]/g, '').replace(/٫/g, '.');
  const v = parseFloat(s); return isNaN(v) ? 0 : v;
}
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

const CARD_THEMES = [['#1E1B4B', '#4338CA', '#06B6D4'], ['#0F172A', '#334155', '#64748B'], ['#064E3B', '#047857', '#34D399'], ['#7C2D12', '#C2410C', '#FBBF24'], ['#4A044E', '#A21CAF', '#F472B6'], ['#172554', '#1D4ED8', '#60A5FA'], ['#450A0A', '#B91C1C', '#F87171'], ['#1C1917', '#78716C', '#D6D3D1']];
const Card = {
  all: () => Store.data.cards.filter(c => !c.archived),
  get: id => Store.data.cards.find(c => c.id === id),
  src: t => t.src || 'cash',
  onCredit: t => { if (!t.src || t.src === 'cash') return false; const c = Card.get(t.src); return !!(c && c.type === 'credit'); },
  txs: c => Store.data.tx.filter(t => t.src === c.id),
  pays: c => Store.data.tx.filter(t => t.cardPay === c.id),
  used(c) {
    if (c.type !== 'credit') return 0;
    let u = c.openingUsed || 0;
    Card.txs(c).forEach(t => u += t.type === 'expense' ? t.amount : -t.amount);
    Card.pays(c).forEach(t => u -= t.amount);
    return r3(u);
  },
  available: c => (c.limit || 0) - Card.used(c),
  spent(c, from, to) { return Card.txs(c).filter(t => t.type === 'expense' && (!from || t.date >= from) && (!to || t.date <= to)).reduce((s, t) => s + t.amount, 0); },
  theme: c => CARD_THEMES[(c.theme || 0) % CARD_THEMES.length],
  label: c => c.name + (c.last4 ? ' •' + c.last4 : ''),
  nextDue(c) {
    if (!c.dueDay) return null; const t = today(), d = parseD(t);
    const mk = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`, day = Math.min(c.dueDay, daysInMonth(mk));
    let due = `${mk}-${pad(day)}`; if (due < t) { const n = addMonths(mk + '-01', 1); due = n.slice(0, 8) + pad(Math.min(c.dueDay, daysInMonth(n.slice(0, 7)))); }
    return due;
  }
};

/* ---------- calculations ---------- */
const Calc = {
  balance() {
    return Store.data.settings.opening + Store.data.tx.reduce((s, t) => Card.onCredit(t) ? s : s + (t.type === 'income' ? t.amount : -t.amount), 0);
  },
  inRange(from, to) { return Store.data.tx.filter(t => (!from || t.date >= from) && (!to || t.date <= to)); },
  sums(list) {
    let inc = 0, exp = 0; list.forEach(t => { if (t.catId === 'cardpay') return; if (t.type === 'income') { if (!Card.onCredit(t)) inc += t.amount; } else exp += t.amount; });
    return { inc, exp, net: inc - exp };
  },
  month(mk) { return Store.data.tx.filter(t => monthKey(t.date) === mk); },
  byCat(list, type = 'expense') {
    const m = {}; list.filter(t => t.type === type && t.catId !== 'cardpay' && !(type === 'income' && Card.onCredit(t))).forEach(t => m[t.catId] = (m[t.catId] || 0) + t.amount);
    return Object.entries(m).map(([id, v]) => ({ cat: cat(id), v })).sort((a, b) => b.v - a.v);
  },
  avgDaily(days = 30) {
    const t = today(), from = addDays(t, -(days - 1));
    const list = Calc.inRange(from, t).filter(x => x.type === 'expense' && x.catId !== 'debtpay' && x.catId !== 'cardpay' && !Card.onCredit(x));
    if (!list.length) return 0;
    const first = Store.data.tx.reduce((m, x) => x.date < m ? x.date : m, t);
    const span = Math.max(7, Math.min(days, diffDays(first, t) + 1));
    return list.reduce((s, x) => s + x.amount, 0) / span;
  },
  runway() {
    const bal = Calc.balance(), avg = Calc.avgDaily();
    if (avg <= 0 || bal <= 0) return { days: bal <= 0 ? 0 : null, avg, date: null };
    const days = Math.floor(bal / avg);
    return { days, avg, date: addDays(today(), days) };
  },
  budgets(mk = monthKey(today())) {
    const list = Calc.month(mk), t = today();
    const dim = daysInMonth(mk), cur = monthKey(t) === mk ? parseD(t).getDate() : dim;
    return Store.data.categories.filter(c => c.type === 'expense' && c.budget > 0).map(c => {
      const spent = list.filter(x => x.type === 'expense' && x.catId === c.id).reduce((s, x) => s + x.amount, 0);
      const rate = spent / Math.max(1, cur);
      const left = c.budget - spent;
      let runsOut = null;
      if (left <= 0) runsOut = 0; else if (rate > 0) runsOut = Math.floor(left / rate);
      const willFinishEarly = runsOut !== null && runsOut < (dim - cur);
      return { c, spent, left, p: pct(spent, c.budget), runsOut, willFinishEarly, daysLeftInMonth: dim - cur };
    }).sort((a, b) => b.p - a.p);
  },
  topItems(list, n = 6) {
    const m = {};
    list.filter(t => t.type === 'expense' && t.note && t.note.trim()).forEach(t => {
      const k = t.note.trim().replace(/\s+/g, ' ');
      m[k] = m[k] || { name: k, count: 0, total: 0, catId: t.catId };
      m[k].count++; m[k].total += t.amount;
    });
    return Object.values(m).sort((a, b) => b.count - a.count || b.total - a.total).slice(0, n);
  },
  weekday(list) {
    const w = Array(7).fill(0); list.filter(t => t.type === 'expense').forEach(t => w[parseD(t.date).getDay()] += t.amount); return w;
  }
};

/* ---------- debts ---------- */
const Debt = {
  instPaid: i => (i.payments || []).reduce((s, p) => s + p.amount, 0),
  instDone: i => Debt.instPaid(i) >= i.amount - 0.009,
  flex: d => d.mode === 'flex',
  adds: d => (d.entries || []).filter(e => e.kind === 'add').reduce((s, e) => s + e.amount, 0),
  pays: d => (d.entries || []).filter(e => e.kind === 'pay').reduce((s, e) => s + e.amount, 0),
  total: d => Debt.flex(d) ? Debt.adds(d) : d.installments.reduce((s, i) => s + i.amount, 0),
  paid: d => Debt.flex(d) ? Debt.pays(d) : d.installments.reduce((s, i) => s + Debt.instPaid(i), 0),
  remaining: d => Math.max(0, Debt.total(d) - Debt.paid(d)),
  done: d => Debt.flex(d) ? Debt.total(d) > 0 && Debt.paid(d) >= Debt.total(d) - 0.009 : d.installments.length > 0 && d.installments.every(Debt.instDone),
  next: d => d.installments.filter(i => !Debt.instDone(i)).sort((a, b) => a.due < b.due ? -1 : 1)[0] || null,
  overdue: d => d.installments.filter(i => !Debt.instDone(i) && i.due < today()),
  schedule(total, count, firstDue, freq, instAmount) {
    count = Math.max(1, Math.round(count));
    const base = instAmount > 0 ? instAmount : Math.floor(total / count * 100) / 100;
    const out = []; let acc = 0, due = firstDue;
    for (let k = 0; k < count; k++) {
      let amt = k === count - 1 ? r3((total - acc)) : base;
      if (amt <= 0) break;
      out.push({ id: uid(), due, amount: amt, payments: [] }); acc += amt;
      due = freq === 'w' ? addDays(due, 7) : freq === '2w' ? addDays(due, 14) : freq === '3m' ? addMonths(due, 3) : freq === '6m' ? addMonths(due, 6) : addMonths(due, 1);
    }
    return out;
  },
  upcoming(days = 7) {
    const t = today(), lim = addDays(t, days), out = [];
    Store.data.debts.forEach(d => d.installments.forEach((i, idx) => {
      if (!Debt.instDone(i) && i.due <= lim) out.push({ d, i, idx, late: i.due < t });
    }));
    return out.sort((a, b) => a.i.due < b.i.due ? -1 : 1);
  }
};

function countUp(root = document) {
  $$('[data-count]', root).forEach(el => {
    const target = parseFloat(el.dataset.count), dur = 1100, t0 = performance.now(), neg = target < 0;
    const cur = el.dataset.cur || '';
    const step = now => {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4);
      const v = Math.round(Math.abs(target) * e);
      el.innerHTML = `${neg ? '−' : ''}${N(p < 1 ? v : r3(Math.abs(target)))}${cur ? ` <small>${esc(cur)}</small>` : ''}`;
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
function animateBars(root = document) {

    $$('[data-w]', root).forEach(el => el.style.width = el.dataset.w + '%');
    $$('[data-off]', root).forEach(el => el.style.strokeDashoffset = el.dataset.off);
  }, 60));
}

/* ---------- charts (pure svg) ---------- */
const Chart = {
  bars(values, labels, { h = 150, color = 'url(#gBar)', highlight = -1, fmt = v => N(r3(v)) } = {}) {
    const W = 340, H = h, pb = 22, pt = 18, n = values.length || 1, max = Math.max(1, ...values);
    const bw = Math.min(26, (W - 10) / n * .62), gap = (W - 10) / n;
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="gBar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#06B6D4"/></linearGradient><linearGradient id="gBarR" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#E11D48"/><stop offset="1" stop-color="#F97316"/></linearGradient></defs>`;
    [.25, .5, .75, 1].forEach(f => { const y = H - pb - (H - pb - pt) * f; s += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 4"/>`; });
    values.forEach((v, k) => {
      const bh = Math.max(v > 0 ? 3 : 0, (H - pb - pt) * v / max), x = W - 5 - gap * k - gap / 2 - bw / 2, y = H - pb - bh;
      s += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="${Math.min(6, bw / 2)}" fill="${k === highlight ? 'url(#gBarR)' : color}" style="transform-origin:center bottom;transform-box:fill-box;animation:growY .9s cubic-bezier(.2,.8,.2,1) ${k * 0.03}s both"/>`;
      if (labels[k] !== '') s += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${esc(labels[k])}</text>`;
      if (k === highlight && v > 0) s += `<text x="${x + bw / 2}" y="${y - 5}" text-anchor="middle" style="fill:var(--text);font-weight:600">${fmt(v)}</text>`;
    });
    return s + '</svg>';
  },
  duo(a, b, labels, { h = 160 } = {}) {
    const W = 340, H = h, pb = 22, pt = 10, n = labels.length || 1, max = Math.max(1, ...a, ...b), gap = (W - 10) / n, bw = Math.min(14, gap * .3);
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}">`;
    [.5, 1].forEach(f => { const y = H - pb - (H - pb - pt) * f; s += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 4"/>`; });
    labels.forEach((l, k) => {
      const cx = W - 5 - gap * k - gap / 2;
      [[a[k], '#10B981', cx + 1], [b[k], '#F43F5E', cx - bw - 1]].forEach(([v, c, x], j) => {
        const bh = Math.max(v > 0 ? 3 : 0, (H - pb - pt) * v / max);
        s += `<rect x="${x}" y="${H - pb - bh}" width="${bw}" height="${bh}" rx="4" fill="${c}" style="transform-origin:center bottom;transform-box:fill-box;animation:growY .9s cubic-bezier(.2,.8,.2,1) ${k * .05 + j * .1}s both"/>`;
      });
      s += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${esc(l)}</text>`;
    });
    return s + '</svg>';
  },
  donut(items, { size = 140, stroke = 22, center = '' } = {}) {
    const r = (size - stroke) / 2, c = 2 * Math.PI * r, total = items.reduce((s, x) => s + x.v, 0) || 1;
    let acc = 0, s = `<svg viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="${stroke}"/>`;
    items.forEach((x, k) => {
      const len = c * x.v / total;
      s += `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${x.color}" stroke-width="${stroke}" stroke-dasharray="${Math.max(0, len - 2)} ${c}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${size / 2} ${size / 2})" style="opacity:0;animation:fadeIn .5s ease ${k * .08}s forwards"/>`;
      acc += len;

    return s + `<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" style="font-family:Plex;font-weight:700;font-size:15px;fill:var(--text)">${center}</text></svg>`;
  },
  ring(p, color = '#4F46E5', label = '') {
    const r = 26, c = 2 * Math.PI * r, off = c * (1 - Math.min(1, p / 100));

  }
};

function syncReminders() {
  if (!NATIVE || !NATIVE.syncReminders || !Store.data) return;
  try {
    const n = Store.data.settings.notif, items = [];
    Store.data.debts.forEach(d => d.installments.forEach(i => {
      if (Debt.instDone(i)) return;
      items.push({ name: d.name, dir: d.direction, due: i.due, amt: moneyT(i.amount - Debt.instPaid(i)) });
    }));
    (Store.data.cards || []).forEach(c => { if (c.type === 'credit' && c.dueDay && !c.archived) { const u = Card.used(c), due = Card.nextDue(c); if (u > 0 && due) items.push({ name: 'بطاقة ' + c.name, dir: 'owe', due, amt: moneyT(u) }); } });
    items.sort((a, b) => a.due < b.due ? -1 : 1);
    const lastTx = Store.data.tx.filter(t => t.type === 'expense').reduce((m, t) => t.date > m ? t.date : m, '');

  grab.addEventListener('touchend', e => { sh.style.transition = ''; const dy = e.changedTouches[0].clientY - y0; y0 = null; if (dy > 90) closeSheet(); else sh.style.transform = ''; });

function noteSuggestions(type, catId, q, cur) {
  const m = {};
  D().tx.filter(t => t.type === type && t.note && t.note.trim()).sort((a, b) => a.createdAt - b.createdAt).forEach(t => {
    const k = t.note.trim().replace(/\s+/g, ' ');
    const x = m[k] = m[k] || { name: k, count: 0, last: 0, catId: t.catId, recent: 0 };
    x.count++; x.last = t.amount; x.catId = t.catId; x.recent = Math.max(x.recent, t.createdAt || 0);
  });
  let list = Object.values(m).filter(x => x.name !== cur);
  if (q) { const n = q.toLowerCase(); list = list.filter(x => x.name.toLowerCase().includes(n) && x.name !== q); }
  const score = x => x.count * 10 + (x.catId === catId ? 25 : 0) + (x.recent > Date.now() - 7 * 864e5 ? 8 : 0) + (q && x.name.startsWith(q) ? 30 : 0);
  return list.sort((a, b) => score(b) - score(a)).slice(0, 10);
}

function backupImport() {

  inp.onchange = () => {

      try { const d = JSON.parse(rd.result); if (!d.settings || !Array.isArray(d.tx)) throw 0;
        const doIt = () => { $('#onb').classList.remove('show'); d.settings.onboarded = true; restoreData(JSON.stringify(d)); };

/* ---- PIN + biometric lock ---- */
const hashPin = p => { let h = 5381; for (const c of 'raseed:' + p) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return h.toString(36); };
const bioOK = () => { try { return !!(NATIVE && NATIVE.bioAvailable && NATIVE.bioAvailable()); } catch (e) { return false; } };
function pinPad(title, onDone, sub = '', opt = {}) {
  const L = $('#lock'); let val = '';
  const left = opt.bio ? `<button data-k="f" class="bio-k" aria-label="البصمة">${I('fingerprint')}</button>` : `<button data-k="x" style="box-shadow:none;background:none">${App.pinCancel ? I('x') : ''}</button>`;
  L.innerHTML = `<div class="lock-logo"><img src="${LOGO_URL}"></div><h2 style="margin:0">${title}</h2><small class="muted" id="lsub">${sub}</small><div class="pin-dots">${'<i></i>'.repeat(4)}</div>
    <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${N(n)}</button>`).join('')}${left}<button data-k="0">${N(0)}</button><button data-k="b" style="box-shadow:none;background:none">${I('backspace')}</button></div>`;
  L.classList.add('show'); updateBar();
  const dots = $$('.pin-dots i', L), upd = () => dots.forEach((d, k) => d.classList.toggle('on', k < val.length));
  $$('.keypad button', L).forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (k === 'f') return askBio();
    if (k === 'b') val = val.slice(0, -1); else if (k === 'x') { if (App.pinCancel) { L.classList.remove('show'); App.pinCancel = false; updateBar(); } return; }
    else if (val.length < 4) val += k;
    if (opt.locked && opt.locked()) { val = ''; upd(); return; }
    upd(); if (NATIVE && NATIVE.vibrate) try { NATIVE.vibrate(8); } catch (e) { }
    if (val.length === 4) setTimeout(() => { const ok = onDone(val); if (ok === false) { if (NATIVE && NATIVE.vibrate) try { NATIVE.vibrate(60); } catch (e) { } $('.pin-dots', L).classList.add('err'); setTimeout(() => { $('.pin-dots', L).classList.remove('err'); val = ''; upd(); }, 420); } }, 120);
  });
}
function unlock() { const L = $('#lock'); L.classList.add('out'); setTimeout(() => { L.classList.remove('show', 'out'); updateBar(); }, 380); App.locked = false; App.fails = 0; }
function askBio() {
  if (!S().bio || !bioOK()) return;
  try { NATIVE.bioAuth(TR('فتح رصيد'), TR('استخدم البصمة أو الوش عشان تفتح')); } catch (e) { }
}
window.raseedBio = (ok, code) => {

};
function lockScreen() {
  if (!S().pin) return;
  App.pinCancel = false; App.locked = true; App.fails = App.fails || 0;
  const useBio = S().bio && bioOK();
  const locked = () => { if (App.waitUntil && Date.now() < App.waitUntil) { const sec = Math.ceil((App.waitUntil - Date.now()) / 1000); $('#lsub').textContent = `استنى ${N(sec)} ثانية وجرّب تاني`; return true; } return false; };
  pinPad('أهلاً بيك 👋', v => {
    if (hashPin(v) === S().pin) { unlock(); return true; }
    App.fails++;
    if (App.fails >= 5) { App.waitUntil = Date.now() + 30000; App.fails = 0; $('#lsub').textContent = 'محاولات كتير غلط — استنى ٣٠ ثانية'; }
    else $('#lsub').textContent = `الرقم غلط — فاضل ${N(5 - App.fails)} محاولات`;
    return false;
  }, useBio ? 'دخّل الرقم السري أو استخدم البصمة' : 'دخّل الرقم السري', { bio: useBio, locked });
  if (useBio) setTimeout(askBio, 450);
}

  },
  daysLeft() { const s = parseD(this.start()); const end = new Date(s.getFullYear(), s.getMonth(), s.getDate() + PRO_TRIAL_DAYS); return Math.max(0, Math.ceil((end - parseD(today())) / 864e5)); },
  locked() { return this.enabled() && this.checked && !this.active && this.daysLeft() <= 0; },
  refresh() { try { if (this.enabled()) NATIVE.proStatus(); } catch (e) { } },
  check() { if (this.locked()) paywall(true); else closePaywall(); }
};
window.raseedPro = st => {
  Pro.checked = true; Pro.active = !!st.active; if (st.price) Pro.price = st.price; if (st.intro != null) Pro.intro = !!st.intro;
  busy && busy(false);
  if (st.event === 'bought') toast('شكراً لاشتراكك في رصيد 💙', 'check');
  if (st.event === 'restored') toast(Pro.active ? 'رجّعنا اشتراكك ✓' : 'مفيش اشتراك على الحساب ده', Pro.active ? 'check' : 'info-circle');
  if (st.event === 'failed') toast('العملية ماكملتش', 'info-circle');
  Pro.check();
  if (App.view === 'settings') refresh();
};

function paywall(force) {
  let P = $('#pay');
  if (!P) { P = document.createElement('div'); P.id = 'pay'; document.body.appendChild(P); }
  const price = Pro.price || '٥٠ ج.م';
  P.innerHTML = `${force ? '' : `<button class="pay-x" onclick="closePaywall()">${I('x')}</button>`}
    <div class="pay-in">
      <img src="${LOGO_URL}" alt="">
      <h2>${force ? 'خلصت الفترة المجانية' : 'اشترك في رصيد'}</h2>
      <p class="muted">${force ? 'اشترك عشان تكمّل تستخدم رصيد — بياناتك كلها محفوظة زي ما هي.' : 'كل مميزات رصيد من غير حدود.'}</p>
      <div class="pay-list">
        <div>${I('check')} مصروفات وإيداعات ومرتب بلا حدود</div>
        <div>${I('check')} المديونيات والأقساط مع التذكير</div>
        <div>${I('check')} البطاقات البنكية والميزانيات</div>
        <div>${I('check')} التقارير والتحليل وتصدير PDF</div>
      </div>
      <div class="pay-price"><b class="notr">${esc(price)}</b> <span>/ الشهر</span>${Pro.intro ? `<small>أول شهر مجاني</small>` : ''}</div>
      <button class="btn" id="payBuy">${I('crown')} ${Pro.intro ? 'ابدأ الشهر المجاني' : 'اشترك دلوقتي'}</button>
      <button class="btn ghost" id="payRestore">${I('refresh')} استرجاع الاشتراك</button>
      ${force ? `<button class="pay-link" onclick="backupExport()">${I('download')} احفظ نسخة من بياناتك</button>` : ''}
      <p class="pay-legal">${Pro.intro ? 'بعد الشهر المجاني ' : ''}الاشتراك بيتجدد تلقائي كل شهر بنفس السعر، ويتخصم من حسابك عند التأكيد. تقدر تلغيه في أي وقت من إعدادات حسابك قبل نهاية الفترة بـ ٢٤ ساعة على الأقل.<br>
      <a href="https://www.apple.com/legal/internet-services/itunes/dev/stdeula/" target="_blank">شروط الاستخدام</a> · <a href="https://alabdo-toys.com/raseed/privacy.html" target="_blank">سياسة الخصوصية</a></p>
    </div>`;
  P.classList.add('show');
  $('#payBuy', P).onclick = () => { busy(true, 'بنفتح صفحة الدفع…'); try { NATIVE.proBuy(); } catch (e) { busy(false); } };
  $('#payRestore', P).onclick = () => { busy(true, 'بندوّر على اشتراكك…'); try { NATIVE.proRestore(); } catch (e) { busy(false); } };
  updateBar && updateBar();
}
function closePaywall() { const P = $('#pay'); if (P && P.classList.contains('show') && !Pro.locked()) { P.classList.remove('show'); updateBar && updateBar(); } }
function proRow(row) {
  if (!Pro.enabled()) return '';
  const left = Pro.daysLeft();
  if (Pro.active) return row('crown', '#F59E0B', 'اشتراك رصيد', 'مشترك ✓ — إدارة الاشتراك', `NATIVE.proManage && NATIVE.proManage()`);
  return row('crown', '#F59E0B', 'اشتراك رصيد', left > 0 ? (EN ? `Free period — ${left} days left` : `فترة مجانية — فاضل ${N(left)} يوم`) : 'خلصت الفترة المجانية', `paywall(false)`, `<span class="badge b-amber">${left > 0 ? N(left) : '!'}</span>`);
}
</script>
</body>
</html>
