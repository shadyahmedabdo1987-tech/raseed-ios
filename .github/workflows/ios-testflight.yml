name: iOS → TestFlight

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Upload to TestFlight after the build"
        type: boolean
        default: true
  push:
    branches: [ios-release]

concurrency: { group: ios-build, cancel-in-progress: false }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/asc_key.p8
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: ${{ secrets.APPLE_TEAM_TYPE || 'INDIVIDUAL' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=""
          for s in EXPO_TOKEN EXPO_ASC_KEY_ID EXPO_ASC_ISSUER_ID EXPO_APPLE_TEAM_ID; do
            [ -z "${!s}" ] && missing="$missing $s"
          done
          [ -z "${{ secrets.ASC_KEY_P8 }}" ] && missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing"; exit 1; fi

      - name: Write App Store Connect key
        run: printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$EXPO_ASC_API_KEY_PATH"

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Install
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix || true

      - name: Link Expo project (creates it the first time)
        run: npx -y eas-cli@latest init --non-interactive --force

      - name: Build on EAS (iOS, production)
        run: npx -y eas-cli@latest build -p ios --profile production --non-interactive --wait

      - name: Upload to TestFlight
        if: ${{ github.event_name == 'push' || inputs.submit }}
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: |
          if [ -n "$ASC_APP_ID" ]; then
            node -e "const f='eas.json',j=require('./'+f);j.submit.production.ios.ascAppId=process.env.ASC_APP_ID;require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          fi
          npx -y eas-cli@latest submit -p ios --latest --non-interactive --profile production --wait

      - name: Clean up key
        if: always()
        run: rm -f "$EXPO_ASC_API_KEY_PATH"
